<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f5f0eb; color: #3b3228; }
/* Full-screen map: nothing scrolls. Also stops the collapsed side panel (slid
   off to the right) from widening the page on phones. */
html, body { overflow: hidden; }
body { position: relative; height: 100vh; }

/* Visible keyboard focus (mouse clicks don't trigger :focus-visible). */
button:focus-visible, input:focus-visible, a:focus-visible,
.leaflet-marker-icon:focus-visible {
  outline: 2px solid #d97706; outline-offset: 2px;
}
.photo-lightbox button:focus-visible { outline-color: #fcd34d; }

#map { width: 100%; height: 100vh; }
#map.map-load-error {
  display: flex; align-items: center; justify-content: center;
  padding: 24px; color: #dc2626; font-size: 16px; text-align: center;
}

/* Top bar */
.top-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
  background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
  border-bottom: 2px solid #7f8c9a;
  padding: 10px 20px;
  display: flex; align-items: baseline; gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.top-bar h1 {
  font-size: 18px; font-weight: 600; color: #f5f6f7;
  white-space: nowrap;
}
.top-bar .subtitle {
  font-size: 12px; color: #c7ccd1;
}
.lang-toggle {
  margin-left: auto; align-self: center; flex-shrink: 0;
  gap: 0; border: 1px solid #7f8c9a; border-radius: 4px; overflow: hidden;
}
.lang-btn {
  background: transparent; color: #c7ccd1; border: none; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 9px;
}
.lang-btn + .lang-btn { border-left: 1px solid #7f8c9a; }
.lang-btn:hover { color: #fff; }
.lang-btn.active { background: #d97706; color: #fff; }
@media (max-width: 480px) {
  .top-bar { padding: 8px 12px; align-items: center; }
  .top-bar h1 { font-size: 14px; white-space: normal; }
  .top-bar .subtitle { display: none; }
  .lang-btn { padding: 4px 7px; font-size: 11px; }
}

/* Timeline bar */
.timeline-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
  background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
  border-top: 2px solid #7f8c9a;
  padding: 10px 20px;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
}
.timeline-controls { display: flex; align-items: center; gap: 14px; }
/* Optional caption (meta.timelineCaption) above the controls. */
.timeline-caption {
  font-size: 11px; color: #c7ccd1; text-align: center; margin-bottom: 6px;
}
body.has-timeline-caption .timeline-bar { padding-top: 8px; }
/* map.js keeps --timeline-height equal to the bar's real height (it grows with
   a caption, and when the caption wraps on phones), so the side panel and
   Leaflet's bottom controls (zoom, attribution) sit above it. */
:root { --timeline-height: 56px; }
.leaflet-bottom { bottom: var(--timeline-height); }
.timeline-play-btn {
  background: #faf9f7; border: 1px solid #d8d4cc;
  color: #6b6355; padding: 6px 10px; cursor: pointer;
  border-radius: 4px; font-size: 13px; flex-shrink: 0;
  transition: color 0.2s;
}
.timeline-play-btn:hover { color: #2c3e50; }
.timeline-bar input[type="range"] {
  flex: 1; accent-color: #f5f6f7;
}
.timeline-date {
  font-size: 13px; color: #f5f6f7; white-space: nowrap;
  min-width: 140px; text-align: right;
}

/* Side panel */
:root { --panel-width: 280px; }
.side-panel {
  position: absolute; top: 52px; right: 0; bottom: var(--timeline-height); width: var(--panel-width);
  z-index: 999; background: #faf9f7; border-left: 2px solid #d8d4cc;
  overflow-y: auto; transition: transform 0.3s;
  padding: 16px;
  box-shadow: -2px 0 8px rgba(0,0,0,0.08);
}
.side-panel.hidden { transform: translateX(100%); }

.panel-toggle {
  position: absolute; top: 62px; right: var(--panel-width); z-index: 1000;
  background: #faf9f7; border: 1px solid #d8d4cc; border-right: none;
  color: #6b6355; padding: 8px 6px; cursor: pointer;
  border-radius: 4px 0 0 4px; font-size: 14px; transition: all 0.3s;
}
.panel-toggle:hover { color: #2c3e50; }
.panel-toggle.panel-hidden { right: 0; }

/* Phones: a fixed 280px panel covers most of the screen. Narrower here, and it
   starts collapsed (map.js: buildMap) until the viewer opens it. */
@media (max-width: 480px) {
  :root { --panel-width: 78vw; }
  .timeline-bar { padding-left: 12px; padding-right: 12px; }
  .timeline-controls { gap: 10px; }
  .timeline-date { min-width: 0; font-size: 12px; }
  /* The wrapped map credit would otherwise cover the zoom-out button. */
  .leaflet-control-attribution { max-width: calc(100vw - 64px); font-size: 10px; }
}

.panel-section { margin-bottom: 20px; }
.panel-section h3 {
  font-size: 13px; color: #2c3e50; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 10px;
  padding-bottom: 4px; border-bottom: 1px solid #d8d4cc;
}

/* Legend items */
.legend-item {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 0; font-size: 13px;
}
.legend-dot {
  width: 12px; height: 12px; border-radius: 50%;
  flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15);
}
.legend-shape { width: 14px; height: 14px; flex-shrink: 0; }
.shape-marker { background: none; border: none; }
.legend-cross {
  width: 14px; height: 14px; border-radius: 50%;
  flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15);
  position: relative;
  background: #555;
}
.legend-cross::before, .legend-cross::after {
  content: ''; position: absolute; background: #fff;
}
.legend-cross::before { left: 50%; top: 20%; bottom: 20%; width: 2px; transform: translateX(-50%); }
.legend-cross::after { top: 50%; left: 20%; right: 20%; height: 2px; transform: translateY(-50%); }

/* Layer toggles */
.layer-toggle {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; font-size: 13px; cursor: pointer;
}
.layer-toggle input { accent-color: #2c3e50; }

/* Hospital marker (divIcon) */
.hospital-marker {
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.25);
  position: relative;
}
.hospital-marker::before, .hospital-marker::after {
  content: ''; position: absolute; background: #fff;
}
.hospital-marker::before { left: 50%; top: 22%; bottom: 22%; width: 3px; transform: translateX(-50%); }
.hospital-marker::after { top: 50%; left: 22%; right: 22%; height: 3px; transform: translateY(-50%); }

/* Family/date chip (divIcon, not a Leaflet tooltip — see markers.js: buildChipMarker) */
.family-chip-icon {
  background: none; border: none; pointer-events: none;
}
.family-chip-inner {
  display: inline-block; white-space: nowrap;
  background: rgba(250, 249, 247, 0.95); border: 1px solid #d8d4cc;
  border-radius: 4px; padding: 3px 6px; font-size: 11px; line-height: 1.4;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
.family-chip-line strong { color: #2c3e50; }
.family-chip-range { color: #8b7a66; }
body.hide-chips .family-chip-icon { display: none; }

/* Worksheet star (divIcon, centered on the marker itself — see markers.js:
   buildWorksheetStar / hasWorksheetLink). Marks stops with a linked write-up,
   as distinct from a bare place pin. Non-interactive, sits above the marker
   pane by default so no z-index rules are needed. */
.worksheet-star {
  display: flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
  font-size: 10px; line-height: 1; color: #fcd34d;
  text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 1px #000;
  pointer-events: none;
}

/* Custom popups */
.leaflet-popup-content-wrapper {
  background: #faf9f7 !important; color: #3b3228 !important;
  border: 1px solid #d8d4cc !important; border-radius: 8px !important;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
}
.leaflet-popup-tip { background: #faf9f7 !important; }
.leaflet-popup-content {
  font-size: 13px; line-height: 1.5; max-width: 320px;
  max-height: 320px; overflow-y: auto; padding-right: 4px;
}
.popup-title {
  font-size: 15px; font-weight: 600; color: #2c3e50;
  margin-bottom: 6px;
}
.popup-badge {
  display: inline-block; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.5px; padding: 2px 6px; border-radius: 3px;
  color: #fff; margin-bottom: 8px;
}
.popup-families { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
.popup-family-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 3px;
  color: #fff; font-weight: 500;
}
.popup-family-tag-years { opacity: 0.85; font-weight: 400; }
/* Expandable family tags share the base .popup-family-tag look but render as a
   <button>, so reset border/font and add a click affordance cue. */
.popup-family-tag-expandable {
  border: none; font: inherit; cursor: pointer;
}
.popup-family-tag-expandable::after { content: ' \25BE'; }
.popup-family-detail {
  margin: 4px 0 8px; padding: 6px 8px;
  background: #f5f0eb; border-left: 3px solid #d8d4cc;
  border-radius: 0 4px 4px 0; font-size: 12px;
}
.popup-family-detail-summary { color: #4a4238; }
.popup-address { color: #6b6255; font-size: 12px; margin-bottom: 8px; }
.popup-reveal-btn {
  display: inline-block; font-size: 12px; padding: 4px 10px;
  border: 1px solid #d97706; border-radius: 4px; background: #fff;
  color: #d97706; cursor: pointer; margin-bottom: 4px;
}
.popup-reveal-btn:hover { background: #fef3e2; }
.popup-desc { color: #4a4238; margin: 8px 0; }
.popup-photos { display: grid; grid-template-columns: repeat(4, 72px); gap: 4px; margin: 8px 0 2px; }
.popup-photo img { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; display: block; border: 1px solid #d8d4cc; }
.popup-photo:hover img { border-color: #d97706; }
.popup-photo-credit { color: #8b7a66; font-size: 11px; font-style: italic; margin-bottom: 6px; }
@media (max-width: 480px) {
  .popup-photos { grid-template-columns: repeat(3, 72px); }
}

.photo-lightbox {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(15, 12, 8, 0.92);
  align-items: center; justify-content: center;
}
.lightbox-figure { margin: 0; max-width: 90vw; text-align: center; }
.lightbox-figure img {
  max-width: 90vw; max-height: 82vh; object-fit: contain;
  display: block; margin: 0 auto; border-radius: 4px;
}
.lightbox-figure figcaption { color: #e8e4dc; font-size: 14px; margin-top: 10px; line-height: 1.4; }
.lightbox-counter { color: #b8ab98; margin-right: 8px; font-variant-numeric: tabular-nums; }
.lightbox-credit { display: block; color: #b8ab98; font-size: 12px; font-style: italic; margin-top: 2px; }
.lightbox-nav, .lightbox-close {
  position: absolute; border: none; cursor: pointer;
  background: rgba(255, 255, 255, 0.12); color: #fff;
  border-radius: 50%; line-height: 1;
}
.lightbox-nav { top: 50%; transform: translateY(-50%); width: 52px; height: 52px; font-size: 34px; }
.lightbox-prev { left: 16px; }
.lightbox-next { right: 16px; }
.lightbox-close { top: 14px; right: 16px; width: 40px; height: 40px; font-size: 20px; }
.lightbox-nav:hover, .lightbox-close:hover { background: #d97706; }
@media (max-width: 800px) {
  .lightbox-nav { width: 44px; height: 44px; font-size: 28px; }
  .lightbox-prev { left: 8px; }
  .lightbox-next { right: 8px; }
}
@media (max-width: 480px) {
  .lightbox-figure, .lightbox-figure img { max-width: 100vw; }
  .lightbox-figure img { border-radius: 0; }
  .lightbox-figure figcaption { font-size: 13px; padding: 0 16px; }
  .lightbox-nav { background: rgba(0, 0, 0, 0.45); }
}
.popup-link {
  display: block; margin-top: 6px;
  color: #2563eb; text-decoration: none; font-size: 12px;
}
.popup-link:hover { text-decoration: underline; }
.popup-events { list-style: none; margin: 8px 0 0; padding: 0; }
.popup-event { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #e8e4dc; }
.popup-event:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.popup-event-date { font-weight: 600; color: #2c3e50; font-size: 12px; }
.popup-event-campaign { color: #8b7a66; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 1px; }
.popup-event-text { color: #4a4238; margin-top: 2px; }
.popup-event-source { color: #8b7a66; font-size: 11px; margin-top: 3px; font-style: italic; }

</style>
<style media="print">
@media print {

  #map { height: 100vh; }

}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// ─── Languages ──────────────────────────────────────────────────────
// Display-text fields in the data may be a plain string or { en: "…", sl: "…" }.
// Translations are stored in the data, not fetched — switching only changes
// which one is shown. See SCHEMA.md "Languages".

let _lang = 'en';

const UI_STRINGS = {
  en: {
    tracks: 'Tracks', legend: 'Legend', showDetails: 'Show details →', hospital: 'Hospital stay',
    playTip: 'Play through the timeline automatically',
    pauseTip: 'Pause the timeline',
    sliderTip: 'Drag to travel through time — markers appear as their date is reached',
    panelTip: 'Show or hide the tracks and legend',
    photoViewer: 'Photo viewer', closeTip: 'Close', prevTip: 'Previous photo', nextTip: 'Next photo'
  },
  sl: {
    tracks: 'Sloji', legend: 'Legenda', showDetails: 'Pokaži podrobnosti →', hospital: 'Bivanje v bolnišnici',
    playTip: 'Samodejno predvajaj časovni trak',
    pauseTip: 'Ustavi časovni trak',
    sliderTip: 'Povlecite za premik skozi čas — oznake se prikažejo, ko je dosežen njihov datum',
    panelTip: 'Pokaži ali skrij sloje in legendo',
    photoViewer: 'Pregledovalnik fotografij', closeTip: 'Zapri', prevTip: 'Prejšnja fotografija', nextTip: 'Naslednja fotografija'
  }
};

const LANGUAGE_LABELS = { en: 'EN', sl: 'SL' };

function t(value) {
  if (value && typeof value === 'object') return value[_lang] || value.en || '';
  return value || '';
}

// Data text is plain text, never HTML — escape it before it goes into markup.
function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// A value passed as a string argument inside an inline onclick="…" attribute.
function jsArg(value) {
  return esc(JSON.stringify(String(value)));
}

function uiText(key) {
  return (UI_STRINGS[_lang] || UI_STRINGS.en)[key] || UI_STRINGS.en[key];
}

function mapLanguages() {
  return (DATA.meta && DATA.meta.languages) || ['en'];
}

// URL ?lang= wins (so a shared link opens in that language), then the viewer's
// last choice, then the map's first listed language.
function initLanguage() {
  const langs = mapLanguages();
  const fromUrl = new URLSearchParams(window.location.search).get('lang');
  let saved = null;
  try { saved = localStorage.getItem('historyMapLang'); } catch (e) {}
  _lang = [fromUrl, saved].find(l => langs.includes(l)) || langs[0];
  document.documentElement.lang = _lang;
  buildLanguageToggle();
}

function buildLanguageToggle() {
  const el = document.getElementById('langToggle');
  const langs = mapLanguages();
  if (langs.length < 2) return;
  el.innerHTML = langs.map(l =>
    `<button type="button" class="lang-btn" data-lang="${esc(l)}" onclick="setLanguage(${jsArg(l)})">${esc(LANGUAGE_LABELS[l] || l.toUpperCase())}</button>`
  ).join('');
  el.style.display = 'flex';
  markActiveLanguage();
}

function markActiveLanguage() {
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === _lang);
    b.setAttribute('aria-pressed', String(b.dataset.lang === _lang));
  });
}

function setLanguage(lang) {
  if (lang === _lang) return;
  _lang = lang;
  try { localStorage.setItem('historyMapLang', lang); } catch (e) {}
  document.documentElement.lang = lang;
  markActiveLanguage();
  applyLanguage();
}

</script>
<script>
// ─── Marker construction ───────────────────────────────────────────
// Whether a track's stops get their color from `statuses` (a person/subject
// track with a with-unit/detached-style split) or always use the track's own
// fixed color (a peer/type track, e.g. "unit", or gary-research's settlement
// types). Configurable per track (`tracks.<key>.colorByStatus`); falls back
// to the pre-existing "unit" special case for maps built before this flag
// existed, so older data needs no changes.
function trackUsesOwnColor(trackKey, track) {
  if (track && typeof track.colorByStatus === 'boolean') return !track.colorByStatus;
  return trackKey === 'unit';
}

function trackColorsByStatus(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  return !trackUsesOwnColor(stop.track, track);
}

function resolveStopColor(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  if (!trackColorsByStatus(stop)) {
    return (track && track.color) || '#888';
  }
  const statusKey = stop.status || 'with-unit';
  const status = DATA.statuses && DATA.statuses[statusKey];
  if (status) return status.color;
  return (track && track.color) || '#888';
}

// Groups a stop's events by an optional per-event `family` tag and returns a
// small HTML label listing each family's earliest–latest date range (using
// each event's display-friendly `date` string, not dateSort, so approximate
// dates like "~1650s" render as written). Returns null if no event carries a
// `family` tag — callers should skip showing a chip entirely in that case.
function buildOccupancyChip(stop) {
  const families = {};
  (stop.events || []).forEach(ev => {
    if (!ev.family) return;
    if (!families[ev.family]) families[ev.family] = { earliest: ev, latest: ev };
    else {
      if (ev.dateSort < families[ev.family].earliest.dateSort) families[ev.family].earliest = ev;
      if (ev.dateSort > families[ev.family].latest.dateSort) families[ev.family].latest = ev;
    }
  });
  const names = Object.keys(families);
  if (!names.length) return null;

  const lines = names.map(name => {
    const { earliest, latest } = families[name];
    const range = earliest === latest ? t(earliest.date) : `${t(earliest.date)}–${t(latest.date)}`;
    return `<div class="family-chip-line"><strong>${esc(name)}</strong> <span class="family-chip-range">(${esc(range)})</span></div>`;
  });
  return `<div class="family-chip-inner">${lines.join('')}</div>`;
}

// Non-interactive divIcon marker carrying the chip HTML, positioned just off
// the stop's own marker. Kept as a separate map layer (not bindTooltip) so it
// doesn't conflict with the marker's own hover-name tooltip.
function buildChipIcon(chipHtml) {
  return L.divIcon({
    className: 'family-chip-icon',
    html: chipHtml,
    iconSize: null,
    iconAnchor: [-14, 10]
  });
}

function buildChipMarker(stop, chipHtml) {
  return L.marker([stop.lat, stop.lng], { icon: buildChipIcon(chipHtml), interactive: false });
}

function buildCircleMarker(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  const radius = (track && track.radius) || 7;
  const color = resolveStopColor(stop);
  const marker = L.circleMarker([stop.lat, stop.lng], {
    radius: radius,
    fillColor: stop.highlight ? '#b45309' : color,
    color: stop.highlight ? '#78350f' : '#fff',
    weight: stop.highlight ? 3 : 2,
    opacity: 1,
    fillOpacity: stop.highlight ? 0.9 : 0.85
  });
  marker.bindPopup(() => buildPopup(stop));
  marker.bindTooltip(() => esc(t(stop.name)), { permanent: false, direction: 'top', offset: [0, -radius] });
  return marker;
}

// Inline SVG for a non-circle track shape ("square", "diamond", "triangle"),
// sized `size` px square. Shared by the map markers and the legend swatches.
function shapeSvg(shape, size, fill, stroke, strokeWidth, fillOpacity) {
  const p = strokeWidth / 2;
  const s = size - p;
  const m = size / 2;
  let body;
  if (shape === 'square') {
    body = `<rect x="${p}" y="${p}" width="${s - p}" height="${s - p}"/>`;
  } else if (shape === 'diamond') {
    body = `<polygon points="${m},${p} ${s},${m} ${m},${s} ${p},${m}"/>`;
  } else {
    body = `<polygon points="${m},${p} ${s},${s} ${p},${s}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">` +
    `<g fill="${esc(fill)}" fill-opacity="${fillOpacity}" stroke="${esc(stroke)}" stroke-width="${strokeWidth}" stroke-linejoin="round">${body}</g></svg>`;
}

// Same styling rules as buildCircleMarker (incl. `highlight`), drawn as a divIcon.
function buildShapeMarker(stop, shape) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  const radius = (track && track.radius) || 7;
  const size = radius * 2 + 4;
  const svg = shapeSvg(
    shape, size,
    stop.highlight ? '#b45309' : resolveStopColor(stop),
    stop.highlight ? '#78350f' : '#fff',
    stop.highlight ? 3 : 2,
    stop.highlight ? 0.9 : 0.85
  );
  const icon = L.divIcon({ className: 'shape-marker', html: svg, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
  const marker = L.marker([stop.lat, stop.lng], { icon });
  marker.bindPopup(() => buildPopup(stop));
  marker.bindTooltip(() => esc(t(stop.name)), { permanent: false, direction: 'top', offset: [0, -size / 2] });
  return marker;
}

function buildHospitalMarker(stop) {
  const color = resolveStopColor(stop);
  const icon = L.divIcon({
    className: '',
    html: `<div class="hospital-marker" style="background:${esc(color)}; width:18px; height:18px;"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });
  const marker = L.marker([stop.lat, stop.lng], { icon });
  marker.bindPopup(() => buildPopup(stop));
  marker.bindTooltip(() => esc(t(stop.name)), { permanent: false, direction: 'top', offset: [0, -9] });
  return marker;
}

function buildMarkerForStop(stop) {
  if (stop.hospital) return buildHospitalMarker(stop);
  const track = DATA.tracks && DATA.tracks[stop.track];
  const shape = track && track.shape;
  return shape && shape !== 'circle' ? buildShapeMarker(stop, shape) : buildCircleMarker(stop);
}

// True when a stop has at least one outbound link into a project's worksheet/
// write-up directory — used to badge markers that have a documented "family
// sheet" behind them, as distinct from a bare place pin with no write-up.
// Matches "worksheets/" anywhere in the href, not just with a leading slash —
// a deployed site may rewrite "../worksheets/x.html" to "worksheets/x.html"
// (no leading slash) if index.html moves to the repo root, so anchoring on
// "/worksheets/" would silently miss those.
function hasWorksheetLink(stop) {
  return !!(stop.links || []).some(link => (link.href || '').includes('worksheets/'));
}

// Small non-interactive star, centered exactly on the stop's own marker (not
// offset like the family/date chip) so it reads as a property of that one
// marker rather than a separate label. `interactive: false` lets clicks and
// hover pass through to the marker beneath it.
function buildWorksheetStar(stop) {
  const icon = L.divIcon({
    className: '',
    html: '<div class="worksheet-star">&#9733;</div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });
  return L.marker([stop.lat, stop.lng], { icon, interactive: false });
}

// Faint, non-interactive placeholder for a stop the timeline slider hasn't reached yet.
// Deliberately has no bindPopup/bindTooltip — only flips to a full marker once revealed.
function buildGhostMarker(stop) {
  return L.circleMarker([stop.lat, stop.lng], {
    radius: 5,
    fillColor: '#999',
    color: '#999',
    weight: 1,
    opacity: 0.3,
    fillOpacity: 0.3,
    interactive: false
  });
}

</script>
<script>
// ─── Popup construction ─────────────────────────────────────────────

// Coerce a families[] entry into object form. A plain string becomes
// {name: f} — no summary, so it always renders as a static tag.
function normalizeFamily(f) {
  return typeof f === 'string' ? { name: f } : f;
}

// Shared show/hide toggle for any popup detail block — used both by
// expandable per-family summaries and by gated stops' "Show details" button.
// Exposed as a plain global function since popup HTML is injected via
// Leaflet's bindPopup and its onclick attributes execute in global scope.
function togglePopupDetail(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const hidden = el.style.display === 'none' || !el.style.display;
  el.style.display = hidden ? 'block' : 'none';
}

function buildPopup(stop) {
  const gated = !!stop.gated;

  let html = `<div class="popup-title">${esc(t(stop.name))}</div>`;
  if (gated && stop.fullPath) {
    html += `<div class="popup-address">${esc(t(stop.fullPath))}</div>`;
  }

  const track = DATA.tracks && DATA.tracks[stop.track];
  const statusKey = trackColorsByStatus(stop) ? (stop.status || 'with-unit') : null;
  const status = statusKey && DATA.statuses && DATA.statuses[statusKey];
  const badgeColor = resolveStopColor(stop);
  const badgeLabel = status ? t(status.label) : (track ? t(track.label) : stop.track);

  let details = `<span class="popup-badge" style="background:${esc(badgeColor)}">${esc(badgeLabel)}</span>`;

  // Family tags — plain strings render as static tags (see SCHEMA.md "Family/date
  // chips"); objects with a `summary` render as expandable tags (see "Family tags").
  // A project with no families concept just omits stop.families.
  if (stop.families && stop.families.length) {
    details += '<div class="popup-families">';
    stop.families.forEach((raw, i) => {
      const f = normalizeFamily(raw);
      const color = (DATA.familyColors && DATA.familyColors[f.name]) || '#666';
      const label = f.years ? `${esc(f.name)} <span class="popup-family-tag-years">${esc(t(f.years))}</span>` : esc(f.name);
      if (f.summary) {
        const detailId = `popup-family-detail-${stop.id}-${i}`;
        details += `<button type="button" class="popup-family-tag popup-family-tag-expandable" style="background:${esc(color)}" onclick="togglePopupDetail(${jsArg(detailId)})">${label}</button>`;
      } else {
        details += `<span class="popup-family-tag" style="background:${esc(color)}">${label}</span>`;
      }
    });
    details += '</div>';

    // Detail blocks for expandable families, one per family with a summary,
    // each independently toggled by its own tag above.
    stop.families.forEach((raw, i) => {
      const f = normalizeFamily(raw);
      if (!f.summary) return;
      const detailId = `popup-family-detail-${stop.id}-${i}`;
      details += `<div id="${esc(detailId)}" class="popup-family-detail" style="display:none;">`;
      details += `<div class="popup-family-detail-summary">${esc(t(f.summary))}</div>`;
      (f.links || []).forEach(link => {
        details += `<a class="popup-link" href="${esc(link.href)}" target="_blank" rel="noopener">${esc(t(link.label))}</a>`;
      });
      details += '</div>';
    });
  }

  // Thumbnail strip, above the prose so it's visible without scrolling; each thumb
  // opens the in-page photo viewer (lightbox.js); Cmd/Ctrl-click still follows the
  // href to a new tab. Fixed thumb dimensions keep the popup
  // from resizing (and re-panning) as images load.
  if (stop.photos && stop.photos.length) {
    details += '<div class="popup-photos">';
    stop.photos.forEach((p, i) => {
      details += `<a class="popup-photo" href="${esc(p.src)}" target="_blank" title="${esc(t(p.caption))}" onclick="return openLightbox(event, ${jsArg(stop.id)}, ${i})">` +
        `<img src="${esc(p.thumb || p.src)}" alt="${esc(t(p.caption))}" width="72" height="72" loading="lazy"></a>`;
    });
    details += '</div>';
    const credits = [...new Set(stop.photos.map(p => t(p.credit)).filter(Boolean))];
    if (credits.length) details += `<div class="popup-photo-credit">${esc(credits.join(' · '))}</div>`;
  }

  // Static prose, for stops without a dated events[] yet.
  if (stop.description) {
    details += `<div class="popup-desc">${esc(t(stop.description))}</div>`;
  }

  const events = (stop.events || []).slice().sort((a, b) => {
    return (a.dateSort || '').localeCompare(b.dateSort || '');
  });

  if (events.length) {
    details += '<ul class="popup-events">';
    events.forEach(ev => {
      details += '<li class="popup-event">';
      details += `<div class="popup-event-date">${esc(t(ev.date))}</div>`;
      if (ev.campaign) details += `<div class="popup-event-campaign">${esc(t(ev.campaign))}</div>`;
      details += `<div class="popup-event-text">${esc(t(ev.text))}</div>`;
      if (ev.source) details += `<div class="popup-event-source">${esc(t(ev.source))}</div>`;
      details += '</li>';
    });
    details += '</ul>';
  }

  // Generic outbound links (e.g. gary-research's per-person worksheet writeups,
  // or a link back to a related static page like sp-houses.html).
  if (stop.links && stop.links.length) {
    stop.links.forEach(link => {
      details += `<a class="popup-link" href="${esc(link.href)}" target="_blank" rel="noopener">${esc(t(link.label))}</a>`;
    });
  }

  if (gated) {
    const detailsId = `popup-details-${stop.id}`;
    html += `<button type="button" class="popup-reveal-btn" onclick="togglePopupDetail(${jsArg(detailsId)}); this.style.display='none';">${esc(uiText('showDetails'))}</button>`;
    html += `<div id="${esc(detailsId)}" class="popup-details" style="display:none;">${details}</div>`;
  } else {
    html += details;
  }

  return html;
}

</script>
<script>
// ─── Photo viewer ───────────────────────────────────────────────────
// Steps through one stop's photos over the map. Opened from the popup
// thumbnails (popup.js); the #photoLightbox markup lives in index.html.

let _lightboxPhotos = [];
let _lightboxIndex = 0;
let _lightboxTouchX = null;
let _lightboxOpener = null; // element to return keyboard focus to on close

function openLightbox(event, stopId, index) {
  if (event.metaKey || event.ctrlKey || event.shiftKey) return true;
  const stop = (DATA.stops || []).find(s => s.id === stopId);
  if (!stop || !stop.photos) return true;
  _lightboxPhotos = stop.photos;
  _lightboxOpener = event.currentTarget || document.activeElement;
  const multiple = _lightboxPhotos.length > 1;
  document.getElementById('lightboxPrev').style.display = multiple ? '' : 'none';
  document.getElementById('lightboxNext').style.display = multiple ? '' : 'none';
  document.getElementById('photoLightbox').style.display = 'flex';
  showLightboxPhoto(index);
  document.getElementById('lightboxClose').focus();
  return false;
}

function showLightboxPhoto(i) {
  const n = _lightboxPhotos.length;
  _lightboxIndex = (i + n) % n;
  const p = _lightboxPhotos[_lightboxIndex];
  const img = document.getElementById('lightboxImg');
  img.src = p.src;
  img.alt = t(p.caption);
  document.getElementById('lightboxCaption').textContent = t(p.caption);
  document.getElementById('lightboxCredit').textContent = t(p.credit);
  document.getElementById('lightboxCounter').textContent = n > 1 ? `${_lightboxIndex + 1} / ${n}` : '';
  if (n > 1) new Image().src = _lightboxPhotos[(_lightboxIndex + 1) % n].src;
}

function stepLightbox(delta) {
  showLightboxPhoto(_lightboxIndex + delta);
}

function closeLightbox() {
  document.getElementById('photoLightbox').style.display = 'none';
  document.getElementById('lightboxImg').removeAttribute('src');
  if (_lightboxOpener && _lightboxOpener.isConnected) _lightboxOpener.focus();
  _lightboxOpener = null;
}

// Keep Tab inside the open viewer (it is a modal dialog).
function trapLightboxTab(e) {
  const buttons = [...document.querySelectorAll('#photoLightbox button')]
    .filter(b => b.style.display !== 'none');
  const i = buttons.indexOf(document.activeElement);
  const next = e.shiftKey ? (i <= 0 ? buttons.length - 1 : i - 1) : (i + 1) % buttons.length;
  buttons[next].focus();
}

function lightboxIsOpen() {
  return document.getElementById('photoLightbox').style.display !== 'none';
}

// Capture phase, so Leaflet's own arrow-key panning doesn't also fire.
document.addEventListener('keydown', e => {
  if (!lightboxIsOpen()) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') stepLightbox(-1);
  else if (e.key === 'ArrowRight') stepLightbox(1);
  else if (e.key === 'Tab') trapLightboxTab(e);
  else return;
  e.preventDefault();
  e.stopPropagation();
}, true);

document.getElementById('photoLightbox').addEventListener('touchstart', e => {
  _lightboxTouchX = e.touches[0].clientX;
}, { passive: true });

document.getElementById('photoLightbox').addEventListener('touchend', e => {
  if (_lightboxTouchX === null || _lightboxPhotos.length < 2) return;
  const dx = e.changedTouches[0].clientX - _lightboxTouchX;
  _lightboxTouchX = null;
  if (Math.abs(dx) > 40) stepLightbox(dx < 0 ? 1 : -1);
});

</script>
<script>
// ─── Legend + track toggles ─────────────────────────────────────────
function buildLegend() {
  const legendEl = document.getElementById('legendItems');
  legendEl.innerHTML = '';

  if (DATA.statuses) {
    Object.values(DATA.statuses).forEach(s => {
      legendEl.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${esc(s.color)}"></div>${esc(t(s.label))}</div>`;
    });
  }

  // Tracks that always use their own fixed color (colorByStatus: false, or the
  // legacy "unit" track) get their own legend line — their color never shows
  // up via `statuses`. Covers both dad_army's "unit" track and a project like
  // gary-research's that has several peer tracks and no statuses at all.
  Object.entries(DATA.tracks || {}).forEach(([key, track]) => {
    if (trackUsesOwnColor(key, track)) {
      const swatch = track.shape && track.shape !== 'circle'
        ? `<div class="legend-shape">${shapeSvg(track.shape, 14, track.color, 'rgba(0,0,0,0.25)', 1, 1)}</div>`
        : `<div class="legend-dot" style="background:${esc(track.color)}"></div>`;
      legendEl.innerHTML += `<div class="legend-item">${swatch}${esc(t(track.label))}</div>`;
    }
  });

  if ((DATA.stops || []).some(s => s.hospital)) {
    legendEl.innerHTML += `<div class="legend-item"><div class="legend-cross" style="background:#555"></div>${uiText('hospital')}</div>`;
  }
}

function buildTrackToggles() {
  const el = document.getElementById('trackToggles');
  el.innerHTML = '';
  if (!DATA.tracks) return;
  Object.keys(DATA.tracks).forEach(key => {
    const label = document.createElement('label');
    label.className = 'layer-toggle';
    label.innerHTML = `<input type="checkbox" ${trackVisible[key] === false ? '' : 'checked'} data-track="${esc(key)}"> ${esc(t(DATA.tracks[key].label))}`;
    label.querySelector('input').addEventListener('change', (e) => {
      toggleTrack(key, e.target.checked);
    });
    el.appendChild(label);
  });
}

</script>
<script>
// ─── Data loading + map init ────────────────────────────────────────
let DATA = null;
let map = null;
let allStops = []; // { stop, track, firstDateSort, revealedMarker, ghostMarker, currentlyShownAs }
const trackVisible = {};
const state = { currentDateSort: null };
let playInterval = null;

async function loadData() {
  // Prefer inline data (works on file://). Fall back to fetch for live editing via http://.
  try {
    const inlineEl = document.getElementById('mapData');
    const inlineText = inlineEl ? inlineEl.textContent.trim() : '';
    if (inlineText && inlineText.startsWith('{')) {
      DATA = JSON.parse(inlineText);
    } else {
      const resp = await fetch('data.json');
      if (!resp.ok) throw new Error(`data.json: HTTP ${resp.status}`);
      DATA = await resp.json();
    }
  } catch (err) {
    showLoadError(err);
    return;
  }
  buildMap();
}

// A broken data file should say so on screen, not leave a blank page.
function showLoadError(err) {
  console.error(err);
  const el = document.getElementById('map');
  el.classList.add('map-load-error');
  el.textContent = `Could not load the map data: ${err.message}`;
  document.querySelector('.timeline-bar').style.display = 'none';
}

// events[] isn't guaranteed sorted by the schema (popup.js sorts defensively too),
// so compute the earliest date rather than trusting events[0]. A stop can have
// no events[] at all (e.g. gary-research places with only a static description) —
// null means "not date-gated," handled in applyVisibility below.
function stopEarliestDateSort(stop) {
  const dates = (stop.events || []).map(e => e.dateSort).filter(Boolean).sort();
  return dates.length ? dates[0] : null;
}

function applyHeadings() {
  document.getElementById('mapTitle').textContent = t(DATA.meta && DATA.meta.title) || 'History Map';
  document.getElementById('mapSubtitle').textContent = t(DATA.meta && DATA.meta.subtitle);
  document.getElementById('tracksHeading').textContent = uiText('tracks');
  document.getElementById('legendHeading').textContent = uiText('legend');
  applyControlLabels();
}

// Sets a control's hover tip and its screen-reader name together.
function labelControl(id, text) {
  const el = document.getElementById(id);
  el.title = text;
  el.setAttribute('aria-label', text);
}

// Hover tips + accessible names for the controls (in the current language), and
// the optional map-specific caption above the timeline (meta.timelineCaption).
function applyControlLabels() {
  labelControl('timelinePlayBtn', uiText(playInterval ? 'pauseTip' : 'playTip'));
  labelControl('timelineSlider', uiText('sliderTip'));
  labelControl('panelToggle', uiText('panelTip'));
  labelControl('lightboxClose', uiText('closeTip'));
  labelControl('lightboxPrev', uiText('prevTip'));
  labelControl('lightboxNext', uiText('nextTip'));
  document.getElementById('photoLightbox').setAttribute('aria-label', uiText('photoViewer'));

  const caption = t(DATA.meta && DATA.meta.timelineCaption);
  const captionEl = document.getElementById('timelineCaption');
  captionEl.textContent = caption;
  captionEl.style.display = caption ? '' : 'none';
  document.body.classList.toggle('has-timeline-caption', !!caption);
}

// Re-renders everything that shows data text. Popups and tooltips are bound
// as functions (markers.js), so they pick up the new language on next open.
function applyLanguage() {
  applyHeadings();
  buildLegend();
  buildTrackToggles();
  map.closePopup();
  allStops.forEach(entry => {
    if (entry.chipMarker) entry.chipMarker.setIcon(buildChipIcon(buildOccupancyChip(entry.stop)));
  });
  if (state.currentDateSort) {
    document.getElementById('timelineDate').textContent = formatDateSort(state.currentDateSort);
  }
}

function buildMap() {
  initLanguage();
  applyHeadings();

  const center = (DATA.meta && DATA.meta.defaultCenter) || [0, 0];
  const zoom = (DATA.meta && DATA.meta.defaultZoom) || 6;

  map = L.map('map', { center, zoom, zoomControl: false });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);

  // Optional site credit (meta.attribution) goes ahead of the tile credit.
  const credit = t(DATA.meta && DATA.meta.attribution);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: (credit ? `${esc(credit)} &middot; ` : '') +
      'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, TomTom, Garmin, FAO, NOAA, USGS, &copy; OpenStreetMap contributors, and the GIS User Community',
    maxZoom: 18
  }).addTo(map);

  // Phones start with the panel collapsed (it would cover most of the map);
  // elsewhere it starts open, so shift the view left to keep the centre visible.
  if (window.matchMedia('(max-width: 480px)').matches) {
    setPanelOpen(false);
  } else {
    map.panBy([-140, 0], { animate: false });
  }

  (DATA.stops || []).forEach(stop => {
    const trackKey = stop.track || 'default';
    if (!(trackKey in trackVisible)) trackVisible[trackKey] = true;
    const chipHtml = stop.gated ? null : buildOccupancyChip(stop);
    allStops.push({
      stop,
      track: trackKey,
      firstDateSort: stopEarliestDateSort(stop),
      revealedMarker: buildMarkerForStop(stop),
      ghostMarker: buildGhostMarker(stop),
      chipMarker: chipHtml ? buildChipMarker(stop, chipHtml) : null,
      worksheetStar: hasWorksheetLink(stop) ? buildWorksheetStar(stop) : null,
      currentlyShownAs: null
    });
  });

  buildLegend();
  buildTrackToggles();
  setupTimeline();
  setupChipVisibility();
}

// Chips only show above a configurable zoom (avoids clutter at country/region
// scale); maps with no family-tagged events never produce chip markers at all,
// so this is a no-op for them regardless.
function setupChipVisibility() {
  const minZoom = DATA.meta && DATA.meta.chipMinZoom;
  if (typeof minZoom !== 'number') return;
  const update = () => {
    document.body.classList.toggle('hide-chips', map.getZoom() < minZoom);
  };
  map.on('zoomend', update);
  update();
}

// Combines track-toggle visibility with slider position into one of three states
// per stop: hidden (track off), ghost (not yet reached), revealed (fully shown).
// A stop with no dated events (firstDateSort === null) is never date-gated —
// it's revealed whenever its track is visible, same as before the slider existed.
// With no dates on the whole map (currentDateSort === null) nothing is gated.
function applyVisibility() {
  allStops.forEach(entry => {
    const wantState = !trackVisible[entry.track] ? null
      : entry.firstDateSort === null || state.currentDateSort === null ? 'revealed'
      : entry.firstDateSort <= state.currentDateSort ? 'revealed'
      : 'ghost';
    if (entry.currentlyShownAs === wantState) return;
    if (entry.currentlyShownAs) {
      map.removeLayer(entry.currentlyShownAs === 'ghost' ? entry.ghostMarker : entry.revealedMarker);
      if (entry.currentlyShownAs === 'revealed' && entry.chipMarker) map.removeLayer(entry.chipMarker);
      if (entry.currentlyShownAs === 'revealed' && entry.worksheetStar) map.removeLayer(entry.worksheetStar);
    }
    if (wantState) {
      (wantState === 'ghost' ? entry.ghostMarker : entry.revealedMarker).addTo(map);
      if (wantState === 'revealed' && entry.chipMarker) entry.chipMarker.addTo(map);
      if (wantState === 'revealed' && entry.worksheetStar) entry.worksheetStar.addTo(map);
    }
    entry.currentlyShownAs = wantState;
  });
}

function toggleTrack(trackKey, visible) {
  trackVisible[trackKey] = visible;
  applyVisibility();
}

// Parse YYYY-MM-DD manually and build a local-time Date — new Date(dateSortString)
// parses as UTC midnight, which can display as the previous day west of Greenwich.
function formatDateSort(dateSort) {
  const [y, m, d] = dateSort.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(_lang, {
    year: 'numeric', month: 'long', day: 'numeric'
  });
}

function setupTimeline() {
  const uniqueDates = Array.from(new Set(
    allStops.flatMap(entry => (entry.stop.events || []).map(e => e.dateSort).filter(Boolean))
  )).sort();

  const slider = document.getElementById('timelineSlider');
  const dateLabel = document.getElementById('timelineDate');

  // No dated events anywhere: no timeline, every stop shown.
  const bar = document.querySelector('.timeline-bar');
  if (!uniqueDates.length) {
    bar.style.display = 'none';
    document.body.classList.remove('has-timeline-caption');
    document.documentElement.style.setProperty('--timeline-height', '0px');
    applyVisibility();
    return;
  }

  slider.min = 0;
  slider.max = uniqueDates.length - 1;
  slider.value = slider.max;
  state.currentDateSort = uniqueDates[slider.value];
  dateLabel.textContent = formatDateSort(state.currentDateSort);

  slider.addEventListener('input', () => {
    state.currentDateSort = uniqueDates[slider.value];
    dateLabel.textContent = formatDateSort(state.currentDateSort);
    applyVisibility();
  });

  document.getElementById('timelinePlayBtn').addEventListener('click', () => togglePlay(slider));

  // Track the bar's real height (caption, wrapping, language switch) for the CSS.
  new ResizeObserver(() => {
    document.documentElement.style.setProperty('--timeline-height', `${bar.offsetHeight}px`);
  }).observe(bar);

  applyVisibility();
}

function togglePlay(slider) {
  if (playInterval) {
    stopPlay();
    return;
  }
  playInterval = setInterval(() => {
    const next = Number(slider.value) + 1;
    if (next > Number(slider.max)) {
      stopPlay();
      return;
    }
    slider.value = next;
    slider.dispatchEvent(new Event('input'));
  }, 600);
  showPlayState();
}

function stopPlay() {
  clearInterval(playInterval);
  playInterval = null;
  showPlayState();
}

function showPlayState() {
  const btn = document.getElementById('timelinePlayBtn');
  btn.innerHTML = playInterval ? '&#10074;&#10074;' : '&#9654;';
  btn.setAttribute('aria-pressed', String(!!playInterval));
  labelControl('timelinePlayBtn', uiText(playInterval ? 'pauseTip' : 'playTip'));
}

function setPanelOpen(open) {
  document.getElementById('sidePanel').classList.toggle('hidden', !open);
  const btn = document.getElementById('panelToggle');
  btn.classList.toggle('panel-hidden', !open);
  btn.setAttribute('aria-expanded', String(open));
}

function togglePanel() {
  setPanelOpen(document.getElementById('sidePanel').classList.contains('hidden'));
  setTimeout(() => map.invalidateSize(), 350);
}

loadData();

</script>
