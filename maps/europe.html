      "events": [
        {
          "date": "Jun 15, 1944",
          "dateSort": "1944-06-15",
          "text": "FIRST COMBAT IN FRANCE. 0935: Gen. Eddy and Col. Smythe arrived at 1st Bn CP (grid 275955 / [~49.376\u00b0N, 1.418\u00b0W](https://www.google.com/maps?q=49.37640,-1.41820)) to brief staff and company commanders. 1041: 1st Bn moved out leading the regiment; order of march: A, B, C, D, Hq. Snipers harassed the march the entire ~6 miles. SP gun shells landed near the road. Small arms fire nearly continuous. By ~1715, companies deployed: C, B, A forward; D in support. 1st Bn front line reached grid (253977) / [~49.396\u00b0N, 1.449\u00b0W](https://www.google.com/maps?q=49.39620,-1.44862)\u2013(247977) / [~49.396\u00b0N, 1.457\u00b0W](https://www.google.com/maps?q=49.39620,-1.45691) by evening. At ~1900, Sgt. Graeff's squad took a direct mortar hit at grid (251974) / [~49.394\u00b0N, 1.451\u00b0W](https://www.google.com/maps?q=49.39350,-1.45138) \u2014 Pvt. Groves KIA; Sgt. Graeff, Pvts. Raimondo, Falconiero, Rollins & Benethum WIA. Enemy fire came from mortars, SP guns, and a battery in the vicinity of Orglandes (grid 252972 / [~49.392\u00b0N, 1.450\u00b0W](https://www.google.com/maps?q=49.39170,-1.45000)). 2015: Artillery fire requested on Orglandes. Three D Company men wounded per D Co. history. Attached units supporting 1st Bn included Co. B, 746th Tank Bn and Co. B, 899th Tank Destroyer Bn. H Company: 1 WIA",
          "source": "D Co./H Co./1st Bn Journal/47th IR Unit Journal/47th IR AA Report",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        }
      ],

    },
    {
      "id": "europe-12",
      "name": "Orglandes area, France",
      "lat": 49.3809,
      "lng": -1.43756,
      "track": "henry",
      "hospital": false,
      "events": [
        {
          "date": "Jun 16, 1944",
          "dateSort": "1944-06-16",
          "text": "HENRY MATOLA WOUNDED. 1st and 3rd Bns continued attack; 1st Bn assigned successive objectives D-F-G. 0750: Artillery from Orglandes hit A Company, then shifted SW. 0830: \"1st Bn receiving mortar fire from vicinity of ORGLANDES.\" 0855: Suspected counterattack from Reigneville (grid 236967 / [~49.387\u00b0N, 1.472\u00b0W](https://www.google.com/maps?q=49.38720,-1.47212)); artillery and high-velocity gun fire from Orglandes hit 1st Bn right flank. Company positions at ~0950: C Co at (252980) / [~49.399\u00b0N, 1.450\u00b0W](https://www.google.com/maps?q=49.39890,-1.45000), B Co at (249975) / [~49.394\u00b0N, 1.454\u00b0W](https://www.google.com/maps?q=49.39440,-1.45415), A Co at (253974) / [~49.394\u00b0N, 1.449\u00b0W](https://www.google.com/maps?q=49.39350,-1.44862). Henry hit by shrapnel. The Co. D morning report records his wound as \"shrap jaw and chest\" and classifies him SWA (Seriously Wounded in Action); the 305th Station Hospital Admission & Disposition report (S23) records \"Pen W rt shoulder sv\" (penetrating wound, right shoulder, severe); his later SGO Hospital Admission Card codes the principal site as the neck \u2014 together describing one artillery-shell-fragment burst across the right side (jaw, neck, chest, shoulder), corroborating the family's account in full. PFC George Kysilka hit by shrapnel to the right leg (also \"SWA\") in the same engagement. Both had consecutive service numbers \u2014 they enlisted together at Fort Hayes, Columbus, Ohio on October 13, 1940 and served side by side through Africa, Sicily, and into Normandy. Both evacuated to the Clearing Company, 9th Medical Battalion (their division's own medical battalion), then to hospitals in England (hospital unknown). Dropped from company rolls this date. By 0900: casualty NCO reported 15 casualties, 1 dead, 1 missing. By 1200: total 1st Bn casualties \u2014 1 KIA, 20 EM WIA, 2 officers WIA, 2 sick evacuated (Henry among the 20 WIA). 1017: C Co commander injured; Lt. Morgan of B Co injured. That afternoon, Lt. Glider (D Co.), Lt. Bowles, and Pvt. Garrison were attacked ~400 yards NE of A Co's position; their vehicle was set on fire \u2014 Lt. Glider, although severely wounded, removed another officer and the body of his driver from the burning vehicle (awarded Bronze Star for this action). Bowles and Garrison presumed KIA. By day's end, 1st Bn had advanced through Hautteville Bocage (grid 238987 / [~49.405\u00b0N, 1.469\u00b0W](https://www.google.com/maps?q=49.40520,-1.46936)) to positions astride the St. Sauveur-Valognes road. H Company: heaviest fire ever laid by company; Canville taken. The Co. D morning report's station line reads \"vicinity of Picauville\" (~49.34\u00b0N, 1.41\u00b0W \u2014 west of the Merderet) \u2014 the company's location of record that day; consistent with the 1st Bn axis of advance through Hautteville Bocage toward St. Sauveur\u2013Valognes",
          "source": "D Co./H Co./Morning Report/Newspaper/1st Bn Journal/47th IR Unit Journal/47th IR AA Report/[Morning Report, NARA Cat. 478540412 p.622](https://catalog.archives.gov/id/478540412?objectPage=622) (S18)",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        }
      ],
      "status": "with-unit"
    },
    {

      "events": [
        {
          "date": "Jun 17, 1944",
          "dateSort": "1944-06-17",
          "text": "Crossed the Douve River. Passed through 82nd Airborne bridgehead at St. Sauveur-le-Vicomte; advanced to cut the Cotentin Peninsula. 3rd Bn led as advance guard, minor opposition at St. Sauveur. German 77th and 709th Divisions withdrawing. By 2200, 1st Bn reached G. de Haunville (097909) / [~49.34\u00b0N, 1.66\u00b0W](https://www.google.com/maps?q=49.33500,-1.66430), severing the La Haye du Puits\u2013Barneville road and completing the isolation of the Cotentin Peninsula. 9th Division credited with greatest advance of the invasion thus far. Strafed by friendly aircraft. 2 men and 2 vehicles captured by enemy",
          "source": "D Co./47th IR Cherbourg History/47th IR AAR",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        }
      ]
    },
    {

      "lat": 49.35,
      "lng": -1.65,
      "track": "unit",
      "hospital": false,
      "events": [
        {
          "date": "Jun 18, 1944",
          "dateSort": "1944-06-18",
          "text": "47th Infantry first unit to reach the sea \u2014 reached Port Bail (068895) / [~49.32\u00b0N, 1.70\u00b0W](https://www.google.com/maps?q=49.32241,-1.70439) and Neuville an Beaumont (138908) / [~49.33\u00b0N, 1.61\u00b0W](https://www.google.com/maps?q=49.33410,-1.60761), credited with actually cutting the peninsula. Mortars fired almost continuously; knocked out enemy column. Strong pocket of several hundred enemy at Canville (115201) / [~49.60\u00b0N, 1.64\u00b0W](https://www.google.com/maps?q=49.59778,-1.63941) reduced after heavy fighting. D Company spotted enemy MGs holding up 2nd Bn's advance and requested permission to fire mortars on them \u2014 authorized at 1705. At 0645, allied planes with friendly markings dive-bombed 2nd Bn, killing one officer (friendly fire). BBC announced 9th Division cut the Cherbourg Peninsula; Gen. Eddy ordered the news passed to all troops. War correspondents at Regimental CP: Herb Clark (Blue Network), Bill Chaplin (NBC), Larry LeSeur, Cpl Joe Cunningham (*Yank* Magazine). Relieved by 357th Infantry (90th Inf. Div.) at 2100; D Co. marched 7 miles to bivouac near Bricquebec",

          "dateSort": "1944-06-28",
          "text": "D Company strength after ~80 replacements: 148 EM & 7 Officers. (A Co: 149 EM & 4 Off; B Co: 141 EM & 5 Off; C Co: 124 EM & 6 Off.) Col. Vanderhoef and patrol personally captured Lt. Col. Kiel, believed to be commander of all remaining Germans in the boot of the peninsula, along with his staff and second-in-command",
          "source": "1st Bn Journal",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        }
      ]
    },

    {
      "id": "europe-18",
      "name": "Outskirts of Cherbourg",

      "track": "unit",
      "hospital": false,
      "events": [
        {
          "date": "Jun 24, 1944",
          "dateSort": "1944-06-24",
          "text": "Captured enemy strong point on outskirts of Cherbourg. 2nd Platoon on hill overlooking city",
          "source": "D Co.",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jun 25, 1944",
          "dateSort": "1944-06-25",
          "text": "47th Infantry first to enter the Cherbourg fortress. Broke into the western side of the city and drove to the beach at ~(115252) / [~49.64\u00b0N, 1.64\u00b0W](https://www.google.com/maps?q=49.64368,-1.63941). 1st Platoon attacked with B Company. Mortars fired ~1,400 rounds into Cherbourg docks. 2nd Bn mortars destroyed 7 Nebelwerfers. Arsenal area partially cleared but thick-walled and underground installations remained a center of strong resistance. Fierce resistance encountered all the way, but \"the spirited drive of the 47th was not to be stopped\"",
          "source": "D Co./47th IR AAR",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jun 26, 1944",
          "dateSort": "1944-06-26",
          "text": "CHERBOURG FELL. White flags appeared. Hundreds of prisoners captured. 1st Bn (\"B\" Company having reverted) entered city at 0800 with C Company leading \u2014 fought all day reducing strongpoints and clearing snipers. All organized resistance ceased except the Arsenal",
          "source": "D Co./47th IR AAR",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jun 27, 1944",
          "dateSort": "1944-06-27",
          "text": "Col. Smythe personally delivered ultimatum to German Commandant General Major Sattler at the Arsenal; surrender effected at 0930. Two German hospitals taken containing 2,600 patients (including 150 American wounded). At 1600, liberation ceremony at the Place de Napoleon \u2014 elements of 9th, 4th, and 79th Divisions participated. Cleaning out remaining enemy toward Cap de la Hague (~3,000 Germans still resisting). H Company: 2 KIA, 1 officer and 14 EM WIA (heavy mortar fire at Acuelleville)",
          "source": "D Co./H Co./47th IR Cherbourg History/47th IR AAR",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        }
      ]
    },
    {
      "id": "europe-19",

          "text": "1st Bn occupied successive objectives along the NE coast of the Cape. 2nd Bn moved through Nacqueville (mined, few enemy). Heavy resistance initially from underground emplacements and artillery, diminishing by 2400. Jun 30: Lt. Stewart of D Company reported wounded. Regiment cleared the last German resistance",

        {
          "date": "Jul 2\u20137, 1944",

          "text": "Rest camp; movies nightly; replacements received. 2nd and 3rd Battalions later awarded Distinguished Unit Badges for the Jun 21\u201326 and Jun 22\u201330 fighting: 2nd Bn captured 4 fortified positions, 1,100 prisoners, and 25 AA guns while suffering 113 casualties; 3rd Bn killed 314 and captured 2,161 enemy while losing 28 killed and 145 wounded in 9 days",

    {
      "id": "europe-22",
      "name": "SW of St. Jean de Daye, France",
      "lat": 49.2,
      "lng": -1.15,
      "track": "unit",
      "hospital": false,
      "events": [
        {
          "date": "Jul 9\u201313, 1944",
          "dateSort": "1944-07-09",
          "text": "Attacked against strong resistance; slow progress against MG, mortar, direct 88mm, and enemy tank fire. Tank counterattack pierced left flank. Facing SS Grenadier groups with modified Mark V tanks. Jul 11 casualties: 7 killed, 24 wounded. Jul 11: Regimental CP hit by accurately placed artillery \u2014 truck, tents, and many valuable records destroyed; Col. Smythe wounded in the hand but not evacuated. Jul 12: 1st and 2nd Bns jumped off at 0800; 8 killed, 21 wounded. 2nd Bn fought into LeHommet against very heavy mortar and AT gun fire; enemy counterattack repulsed. Unusual enemy tank/armor activity observed at (420716) / [~49.16\u00b0N, 1.22\u00b0W](https://www.google.com/maps?q=49.16132,-1.21773) \u2014 all Bns ordered into strong defensive positions with mines and roadblocks. H Company: 7 EM WIA on Jul 9; medic KIA and multiple WIA on Jul 13. Jul 13: Lt. Centurione (D Co.) killed near a crossroads by artillery shell \u2014 he had participated in the Anglo-American exchange program on the Isle of Wight in April 1944. D Company warned about mortar fire near G Company's position at grid (424717) / [~49.16\u00b0N, 1.22\u00b0W](https://www.google.com/maps?q=49.16132,-1.21773). Jul 13: 2 killed, 9 wounded",
          "source": "D Co./H Co./1st Bn Journal/47th IR AAR",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        }
      ]
    },
    {
      "id": "europe-23",
      "name": "SW of St. Lo, France",
      "lat": 49.1167,

      "track": "unit",
      "hospital": false,
      "events": [
        {
          "date": "Jul 17\u201320, 1944",
          "dateSort": "1944-07-17",
          "text": "Enemy artillery extremely heavy. Jul 17: 1st Bn suffered 8 KIA and 35 WIA \u2014 D Company reported at 1015 that friendly artillery (\"Nostril White\") was falling short into their area. H Company: 3 WIA on Jul 17; 10 WIA on Jul 18. Jul 19: 1st Bn in reserve; received 105 EM and 4 Officer replacements. Jul 20: D Company CO Capt. Jesse F. Niven killed by enemy artillery. Shrapnel from the same barrage also killed Capt. Minton and Lt. Murray at the Bn CP, and wounded Pvts. Farnsworth, Beer, and Sgt. Cross; 1 B Co man also killed, 3 wounded. Lt. Frederick Scheel took command of D Company. Staff and Company Commanders meeting held at 2345",
          "source": "D Co./H Co./1st Bn Journal",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jul 21, 1944",
          "dateSort": "1944-07-21",
          "text": "6 officers and 5 EM returned from hospital in England. Five missing A Company men located.",
          "source": "1st Bn Journal/[Morning Report, NARA Cat. 481125251 p.587](https://catalog.archives.gov/id/481125251?objectPage=587) (S18)",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jul 23, 1944",
          "dateSort": "1944-07-23",
          "text": "Mass held in Bn area. 102 more replacements + 7 returnees received. Lt. McLaughlin became acting S-3 (replacing the killed Capt. Minton). Friendly planes bombed and strafed enemy positions",

          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jul 24, 1944",
          "dateSort": "1944-07-24",
          "text": "Cobra H-hour announced as 1300. Battalions withdrew to bomb-safety line. Attack suspended due to very low ceiling \u2014 all Bns moved forward quickly to re-occupy vacated ground before the enemy could take it. Met small arms, mortar, and heavy artillery fire returning to positions. 4 casualties from enemy artillery",
          "source": "47th IR AAR/1st Bn Journal",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jul 25, 1944",
          "dateSort": "1944-07-25",
          "text": "OPERATION COBRA. At 0927 all troops pulled back to bomb-safety line. Light bombers went in first, followed by a full hour of heavy bombers. Due to a light breeze from the south, haze and target-marking smoke drifted toward American lines, causing bombers to drop some of their load on own units \u2014 casualties in the regiment. \"The greatest bombing.\" Dust and dirt rose hundreds of feet. 1st Bn started moving at 1100, reached the highway by 1400, and pushed south to (394661\u2013398660) / [~49.11\u00b0N, 1.25\u00b0W](https://www.google.com/maps?q=49.11182,-1.25367) by 2245. 3rd Armored and 1st Infantry rushed through the breach. H Company: 2 EM KIA by friendly bombs; 1 WIA by bomb fragments",
          "source": "D Co./H Co./47th IR AAR",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jul 26\u201329, 1944",
          "dateSort": "1944-07-26",
          "text": "Rapid advance with daily casualties. Jul 26: 14 WIA; 4 KIA, 17 WIA. Jul 27: ~4 KIA, 28 WIA. Maj. Bryant promoted to Regt. S-2; Lt. Langland returned as Bn S-2; Lt. Snyder became Bn S-3. Jul 28: Enemy planes bombed and strafed the area \u2014 31 casualties. Jul 29: Division in Corps reserve, 2.5 miles SE of Marigny. Anti-aircraft shell exploded on shed roof, injuring Pvt. Taylor and AT platoon leader. 1st Bn CP at (397390) / [~49.07\u00b0N, 1.21\u00b0W](https://www.google.com/maps?q=49.0669,-1.2100) *(grid too far from Orglandes anchor for formula conversion; located from \"2.5 miles SE of Marigny\")*",

    {
      "id": "europe-21",
      "name": "Whittington Barracks, Lichfield, Staffordshire, England",
      "lat": 52.677,
      "lng": -1.789,
      "track": "henry",
      "hospital": false,
      "events": [
        {
          "date": "Jul 19, 1944",
          "dateSort": "1944-07-19",
          "text": "AWOL at 2330 hrs. Six days after release from hospital, Henry went absent without leave from the 10th Replacement Depot at Lichfield \u2014 headquartered at Whittington Barracks (with a satellite staging camp at the Pheasey Estate), the principal U.S. Army replacement and disciplinary command in the UK (later notorious for the \"Lichfield case\" treatment-of-prisoners court-martial, 1945). The morning report documents the AWOL with timestamp",
          "source": "[Morning Report, NARA Cat. 481125251 p.587](https://catalog.archives.gov/id/481125251?objectPage=587) (S18)",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jul 25, 1944",
          "dateSort": "1944-07-25",
          "text": "Court-martial: convicted of AWOL. Trial held 6 days after the Jul 19 absence. The Jul 27 morning report (next entry) records the conviction date and the disposition; no separate Jul 25 morning report has been located. (Henry's only known disciplinary record.)",
          "source": "[Morning Report, NARA Cat. 481125251 p.794](https://catalog.archives.gov/id/481125251?objectPage=794) (S18) (referenced)",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        },
        {
          "date": "Jul 27, 1944, 0745 hrs",
          "dateSort": "1944-07-27",
          "text": "Released from confinement at 0745; returned to duty. Two days of post-conviction confinement (Jul 25 \u2192 Jul 27) \u2014 the entire AWOL-and-conviction episode resolved in 8 days from start to finish. The case was disposed of locally and Henry remained in the replacement system rather than rejoining a combat unit. Henry retained his PFC rank \u2014 every subsequent morning report (Sep 1944 through discharge Jun 1945) lists him as PFC, and his Honorable Discharge at Fort Dix on Jun 24, 1945 records him as PFC. Reduction in grade was a standard element of any court-martial AWOL conviction at this period (the maximum punishment for a Summary Court-Martial included reduction by one grade); the fact that Henry's rank survived indicates the offense was disposed at the lowest level and treated as a minor infraction. The brief confinement (~2 days) is consistent with a Summary Court-Martial sentence, not a Special or General. He also retained eligibility for the Good Conduct Medal, which requires 3+ years of \"exemplary behavior, efficiency, and fidelity\" and which he received",
          "source": "[Morning Report, NARA Cat. 481125251 p.794](https://catalog.archives.gov/id/481125251?objectPage=794) (S18)",
          "campaign": "D-Day and Normandy (Jun\u2013Aug 1944)"
        }
      ],
      "status": "detached"
    },

    {

      "events": [
        {
          "date": "Sep 14, 1944",
          "dateSort": "1944-09-14",
          "text": "Crossed the German border at Roetgen (grid 905285) at 0830. Entered the Siegfried Line. Penetrated well into the outer defenses. Worked through dense forest. Captured 41 prisoners. Noted camouflaged pillboxes (one built to look like a cottage). 1st Bn advanced to Zweifall (grid 955362 / [~50.71\u00b0N, 6.25\u00b0E](https://www.google.com/maps?q=50.7115,6.2478)), held up by blown bridge. Marched 14 miles. H Company: enemy attacked with tanks at 0730; 1 EM WIA",

        }

    {
      "id": "europe-31",
      "name": "Vicht (50.72\u00b0N, 6.28\u00b0E) / Mausbach / Schevenhutte",
      "lat": 50.7167,
      "lng": 6.2833,
      "track": "unit",
      "hospital": false,
      "events": [
        {
          "date": "Sep 15\u201316, 1944",
          "dateSort": "1944-09-15",
          "text": "Sep 15: Plan to outflank Vicht from east. 3rd Bn engaged 350 enemy attempting to withdraw; 2nd Bn counterattacked by tank and infantry at 0900 \u2014 Mark V tank destroyed. 425 prisoners captured including a Colonel and 4 officers. Sep 16: 1st Bn entered Vicht at 1530, captured 100+ prisoners. 2nd Bn reached Krewinkel (grid 980410 / [~50.76\u00b0N, 6.27\u00b0E](https://www.google.com/maps?q=50.7562,6.2681)), captured ~95 prisoners. 3rd Bn contacted strong force 400 yards short of Schevenhutte (grid 005420 / [~50.76\u00b0N, 6.30\u00b0E](https://www.google.com/maps?q=50.7610,6.2997)). Regimental CP established at Vicht \u2014 remained there through October",
          "source": "D Co./H Co./47th IR AAR",
          "campaign": "Belgium and the Siegfried Line (Sep\u2013Dec 1944)"
        },
        {
          "date": "Sep 17\u201319, 1944",
          "dateSort": "1944-09-17",
          "text": "Heavy counterattacks. Sep 17: 2nd Bn attacked by waves of enemy infantry with tanks, mortars, artillery from NE. 3rd Bn \"surrounded by enemy, but not seriously.\" 1st Bn moved to dominating ground (grid 994418 / [~50.76\u00b0N, 6.29\u00b0E](https://www.google.com/maps?q=50.7601,6.2879)) between 2nd and 3rd Bns. Sep 18: 3rd Bn counterattacked at 0130 from Gressenich direction; 2nd Bn moved back to reorganize. Sep 19: \"Heaviest enemy artillery barrage ever experienced\" at 0730. Supply lines stretched to breaking point. D Company: 5 EM wounded by enemy artillery on Sep 17 and 19",
          "source": "D Co./H Co./47th IR AAR",
          "campaign": "Belgium and the Siegfried Line (Sep\u2013Dec 1944)"
        },
        {
          "date": "Sep 20\u201322, 1944",
          "dateSort": "1944-09-20",
          "text": "Defensive positions; constant enemy artillery, mortar, and tank fire. D Company 81mm mortars fired avg. 200 rounds/day (ammunition rationed). Sep 22: Major counterattack on 3rd Bn at Schevenhutte \u2014 preceded by \"biggest artillery preparation ever put on against the battalion.\" Positions overrun at 0640; restored by 0813. At least 1 full-strength enemy battalion attacked. Enemy casualties: 135+ dead counted in Schevenhutte, 35 wounded evacuated by US medics, 37 captured. 3rd Bn casualties: 7 KIA, 48 WIA (described as \"extremely light\" given scale of attack)",
          "source": "D Co./H Co./47th IR AAR",
          "campaign": "Belgium and the Siegfried Line (Sep\u2013Dec 1944)"
        },
        {
          "date": "Sep 23\u201330, 1944",
          "dateSort": "1944-09-23",
          "text": "Continued defensive positions. Total losses Sep 14\u201330: 8 EM killed, 28 wounded, 1 officer wounded",
          "source": "D Co.",
          "campaign": "Belgium and the Siegfried Line (Sep\u2013Dec 1944)"
        }
      ]
    },

        {
          "date": "Nov 19\u201322, 1944",
          "dateSort": "1944-11-19",
          "text": "Bitter multi-day fight for Hill 187 (grid 985456) \u2014 enemy had direct observation on attacking troops crossing open ground. Nov 19: 1st Bn moved to Hill 232 (grid 997443 / [~50.78\u00b0N, 6.29\u00b0E](https://www.google.com/maps?q=50.7826,6.2903)); Co B assaulted Hill 187 but stopped by intense 88mm flat-trajectory fire. Nov 20: Co B failed again. Nov 21: Co C passed through Co B, reached western edge of Hill 187 but could not advance further \u2014 \"casualties were severe.\" Trees felled by shells made the woods impenetrable; supply and evacuation \"one of the utmost hazard.\" Casualties so severe that CG 1st Infantry Division ordered the Combat Team to consolidate at 1320; 17 battalions of corps artillery fired 3-minute concentration on Hill 187 at 1615. Ordered to report effective strength. Nov 22: Patrols found Hills 187 and 167 (grid 991462 / [~50.80\u00b0N, 6.28\u00b0E](https://www.google.com/maps?q=50.8004,6.2832)) unoccupied \u2014 enemy had withdrawn overnight. Both hills occupied by platoons",

          "campaign": "Belgium and the Siegfried Line (Sep\u2013Dec 1944)"

          "text": "Assault on fortified Frenzerberg Castle (grid 019489). Nov 26: Co K took SW corner; 2nd Bn reached castle at 2100. 1st Bn reduced strongpoint at (grid 022478 / [~50.81\u00b0N, 6.31\u00b0E](https://www.google.com/maps?q=50.8131,6.3157)) under smoke screen by 1800. Nov 27: Castle shelled all day \u2014 walls too thick to breach. At 1700, enemy commander requested truce to evacuate wounded; PW interrogator tried to effect surrender but failed. 11 seriously wounded evacuated. Nov 28: Co G assaulted the strongpoint at 0900; all buildings cleared by 1030. 1st Bn relieved by 1st Infantry Division elements. H Company: fierce hand-to-hand combat with German paratroopers",

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─── Marker construction ───────────────────────────────────────────
// Whether a track's stops get their color from `statuses` (a person/subject
// track with a with-unit/detached-style split) or always use the track's own
// fixed color (a peer/type track, e.g. "unit", or gary-research's settlement
// types). Configurable per track (`tracks.<key>.colorByStatus`); falls back
// to the pre-existing "unit" special case for maps built before this flag
// existed, so older data needs no changes.
function trackUsesOwnColor(trackKey, track) {
  if (track && typeof track.colorByStatus === 'boolean') return !track.colorByStatus;
  return trackKey === 'unit';
}

function trackColorsByStatus(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  return !trackUsesOwnColor(stop.track, track);
}

function resolveStopColor(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  if (!trackColorsByStatus(stop)) {
    return (track && track.color) || '#888';
  }
  const statusKey = stop.status || 'with-unit';
  const status = DATA.statuses && DATA.statuses[statusKey];
  if (status) return status.color;
  return (track && track.color) || '#888';
}

// Groups a stop's events by an optional per-event `family` tag and returns a
// small HTML label listing each family's earliest–latest date range (using
// each event's display-friendly `date` string, not dateSort, so approximate
// dates like "~1650s" render as written). Returns null if no event carries a
// `family` tag — callers should skip showing a chip entirely in that case.
function buildOccupancyChip(stop) {
  const families = {};
  (stop.events || []).forEach(ev => {
    if (!ev.family) return;
    if (!families[ev.family]) families[ev.family] = { earliest: ev, latest: ev };
    else {
      if (ev.dateSort < families[ev.family].earliest.dateSort) families[ev.family].earliest = ev;
      if (ev.dateSort > families[ev.family].latest.dateSort) families[ev.family].latest = ev;
    }
  });
  const names = Object.keys(families);
  if (!names.length) return null;

  const lines = names.map(name => {
    const { earliest, latest } = families[name];
    const range = earliest === latest ? earliest.date : `${earliest.date}–${latest.date}`;
    return `<div class="family-chip-line"><strong>${name}</strong> <span class="family-chip-range">(${range})</span></div>`;
  });
  return `<div class="family-chip-inner">${lines.join('')}</div>`;
}

// Non-interactive divIcon marker carrying the chip HTML, positioned just off
// the stop's own marker. Kept as a separate map layer (not bindTooltip) so it
// doesn't conflict with the marker's own hover-name tooltip.
function buildChipMarker(stop, chipHtml) {
  const icon = L.divIcon({
    className: 'family-chip-icon',
    html: chipHtml,
    iconSize: null,
    iconAnchor: [-14, 10]
  });
  return L.marker([stop.lat, stop.lng], { icon, interactive: false });
}

function buildCircleMarker(stop) {
  const track = DATA.tracks && DATA.tracks[stop.track];
  const radius = (track && track.radius) || 7;
  const color = resolveStopColor(stop);
  const marker = L.circleMarker([stop.lat, stop.lng], {
    radius: radius,
    fillColor: stop.highlight ? '#b45309' : color,
    color: stop.highlight ? '#78350f' : '#fff',
    weight: stop.highlight ? 3 : 2,
    opacity: 1,
    fillOpacity: stop.highlight ? 0.9 : 0.85
  });
  marker.bindPopup(buildPopup(stop));
  marker.bindTooltip(stop.name, { permanent: false, direction: 'top', offset: [0, -radius] });
  return marker;
}

function buildHospitalMarker(stop) {
  const color = resolveStopColor(stop);
  const icon = L.divIcon({
    className: '',
    html: `<div class="hospital-marker" style="background:${color}; width:18px; height:18px;"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });
  const marker = L.marker([stop.lat, stop.lng], { icon });
  marker.bindPopup(buildPopup(stop));
  marker.bindTooltip(stop.name, { permanent: false, direction: 'top', offset: [0, -9] });
  return marker;
}

function buildMarkerForStop(stop) {
  return stop.hospital ? buildHospitalMarker(stop) : buildCircleMarker(stop);
}

// Faint, non-interactive placeholder for a stop the timeline slider hasn't reached yet.
// Deliberately has no bindPopup/bindTooltip — only flips to a full marker once revealed.
function buildGhostMarker(stop) {
  return L.circleMarker([stop.lat, stop.lng], {
    radius: 5,
    fillColor: '#999',
    color: '#999',
    weight: 1,
    opacity: 0.3,
    fillOpacity: 0.3,
    interactive: false
  });
}

</script>
<script>
// ─── Popup construction ─────────────────────────────────────────────
function buildPopup(stop) {
  let html = `<div class="popup-title">${stop.name}</div>`;

  const track = DATA.tracks && DATA.tracks[stop.track];
  const statusKey = trackColorsByStatus(stop) ? (stop.status || 'with-unit') : null;
  const status = statusKey && DATA.statuses && DATA.statuses[statusKey];
  const badgeColor = resolveStopColor(stop);
  const badgeLabel = status ? status.label : (track ? track.label : stop.track);
  html += `<span class="popup-badge" style="background:${badgeColor}">${badgeLabel}</span>`;

  // Flat family tags — for stops with no per-event `family` data yet (see SCHEMA.md
  // "Family/date chips"); a project with no families concept just omits stop.families.
  if (stop.families && stop.families.length) {
    html += '<div class="popup-families">';
    stop.families.forEach(f => {
      const color = (DATA.familyColors && DATA.familyColors[f]) || '#666';
      html += `<span class="popup-family-tag" style="background:${color}">${f}</span>`;
    });
    html += '</div>';
  }

  // Static prose, for stops without a dated events[] yet.
  if (stop.description) {
    html += `<div class="popup-desc">${stop.description}</div>`;
  }

  const events = (stop.events || []).slice().sort((a, b) => {
    return (a.dateSort || '').localeCompare(b.dateSort || '');
  });

  if (events.length) {
    html += '<ul class="popup-events">';
    events.forEach(ev => {
      html += '<li class="popup-event">';
      html += `<div class="popup-event-date">${ev.date}</div>`;
      if (ev.campaign) html += `<div class="popup-event-campaign">${ev.campaign}</div>`;
      html += `<div class="popup-event-text">${ev.text}</div>`;
      if (ev.source) html += `<div class="popup-event-source">${ev.source}</div>`;
      html += '</li>';
    });
    html += '</ul>';
  }

  // Generic outbound links (e.g. gary-research's per-person worksheet writeups,
  // or a link back to a related static page like sp-houses.html).
  if (stop.links && stop.links.length) {
    stop.links.forEach(link => {
      html += `<a class="popup-link" href="${link.href}" target="_blank">${link.label}</a>`;
    });
  }

  return html;
}

</script>
<script>
// ─── Legend + track toggles ─────────────────────────────────────────
function buildLegend() {
  const legendEl = document.getElementById('legendItems');
  legendEl.innerHTML = '';

  if (DATA.statuses) {
    Object.values(DATA.statuses).forEach(s => {
      legendEl.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div>${s.label}</div>`;
    });
  }

  // Tracks that always use their own fixed color (colorByStatus: false, or the
  // legacy "unit" track) get their own legend line — their color never shows
  // up via `statuses`. Covers both dad_army's "unit" track and a project like
  // gary-research's that has several peer tracks and no statuses at all.
  Object.entries(DATA.tracks || {}).forEach(([key, track]) => {
    if (trackUsesOwnColor(key, track)) {
      legendEl.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${track.color}"></div>${track.label}</div>`;
    }
  });

  if ((DATA.stops || []).some(s => s.hospital)) {
    legendEl.innerHTML += `<div class="legend-item"><div class="legend-cross" style="background:#555"></div>Hospital stay</div>`;
  }
}

function buildTrackToggles() {
  const el = document.getElementById('trackToggles');
  el.innerHTML = '';
  if (!DATA.tracks) return;
  Object.keys(DATA.tracks).forEach(key => {
    const t = DATA.tracks[key];
    const label = document.createElement('label');
    label.className = 'layer-toggle';
    label.innerHTML = `<input type="checkbox" checked data-track="${key}"> ${t.label}`;
    label.querySelector('input').addEventListener('change', (e) => {
      toggleTrack(key, e.target.checked);
    });
    el.appendChild(label);
  });
}

</script>
<script>
// ─── Data loading + map init ────────────────────────────────────────
let DATA = null;
let map = null;
let allStops = []; // { stop, track, firstDateSort, revealedMarker, ghostMarker, currentlyShownAs }
const trackVisible = {};
const state = { currentDateSort: null };
let playInterval = null;

async function loadData() {
  // Prefer inline data (works on file://). Fall back to fetch for live editing via http://.
  const inlineEl = document.getElementById('mapData');
  const inlineText = inlineEl ? inlineEl.textContent.trim() : '';
  if (inlineText && inlineText.startsWith('{')) {
    DATA = JSON.parse(inlineText);
  } else {
    const resp = await fetch('data.json');
    DATA = await resp.json();
  }
  buildMap();
}

// events[] isn't guaranteed sorted by the schema (popup.js sorts defensively too),
// so compute the earliest date rather than trusting events[0]. A stop can have
// no events[] at all (e.g. gary-research places with only a static description) —
// null means "not date-gated," handled in applyVisibility below.
function stopEarliestDateSort(stop) {
  if (!stop.events || !stop.events.length) return null;
  return stop.events.map(e => e.dateSort).sort()[0];
}

function buildMap() {
  document.getElementById('mapTitle').textContent = (DATA.meta && DATA.meta.title) || 'History Map';
  document.getElementById('mapSubtitle').textContent = (DATA.meta && DATA.meta.subtitle) || '';

  const center = (DATA.meta && DATA.meta.defaultCenter) || [0, 0];
  const zoom = (DATA.meta && DATA.meta.defaultZoom) || 6;

  map = L.map('map', { center, zoom, zoomControl: false });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  map.panBy([-140, 0], { animate: false });

  (DATA.stops || []).forEach(stop => {
    const trackKey = stop.track || 'default';
    if (!(trackKey in trackVisible)) trackVisible[trackKey] = true;
    const chipHtml = buildOccupancyChip(stop);
    allStops.push({
      stop,
      track: trackKey,
      firstDateSort: stopEarliestDateSort(stop),
      revealedMarker: buildMarkerForStop(stop),
      ghostMarker: buildGhostMarker(stop),
      chipMarker: chipHtml ? buildChipMarker(stop, chipHtml) : null,
      currentlyShownAs: null
    });
  });

  buildLegend();
  buildTrackToggles();
  setupTimeline();
  setupChipVisibility();
}

// Chips only show above a configurable zoom (avoids clutter at country/region
// scale); maps with no family-tagged events never produce chip markers at all,
// so this is a no-op for them regardless.
function setupChipVisibility() {
  const minZoom = DATA.meta && DATA.meta.chipMinZoom;
  if (typeof minZoom !== 'number') return;
  const update = () => {
    document.body.classList.toggle('hide-chips', map.getZoom() < minZoom);
  };
  map.on('zoomend', update);
  update();
}

// Combines track-toggle visibility with slider position into one of three states
// per stop: hidden (track off), ghost (not yet reached), revealed (fully shown).
// A stop with no dated events (firstDateSort === null) is never date-gated —
// it's revealed whenever its track is visible, same as before the slider existed.
function applyVisibility() {
  allStops.forEach(entry => {
    const wantState = !trackVisible[entry.track] ? null
      : entry.firstDateSort === null ? 'revealed'
      : entry.firstDateSort <= state.currentDateSort ? 'revealed'
      : 'ghost';
    if (entry.currentlyShownAs === wantState) return;
    if (entry.currentlyShownAs) {
      map.removeLayer(entry.currentlyShownAs === 'ghost' ? entry.ghostMarker : entry.revealedMarker);
      if (entry.currentlyShownAs === 'revealed' && entry.chipMarker) map.removeLayer(entry.chipMarker);
    }
    if (wantState) {
      (wantState === 'ghost' ? entry.ghostMarker : entry.revealedMarker).addTo(map);
      if (wantState === 'revealed' && entry.chipMarker) entry.chipMarker.addTo(map);
    }
    entry.currentlyShownAs = wantState;
  });
}

function toggleTrack(trackKey, visible) {
  trackVisible[trackKey] = visible;
  applyVisibility();
}

// Parse YYYY-MM-DD manually and build a local-time Date — new Date(dateSortString)
// parses as UTC midnight, which can display as the previous day west of Greenwich.
function formatDateSort(dateSort) {
  const [y, m, d] = dateSort.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    year: 'numeric', month: 'long', day: 'numeric'
  });
}

function setupTimeline() {
  const uniqueDates = Array.from(new Set(
    allStops.flatMap(entry => (entry.stop.events || []).map(e => e.dateSort))
  )).sort();

  const slider = document.getElementById('timelineSlider');
  const dateLabel = document.getElementById('timelineDate');

  slider.min = 0;
  slider.max = uniqueDates.length - 1;
  slider.value = slider.max;
  state.currentDateSort = uniqueDates[slider.value];
  dateLabel.textContent = formatDateSort(state.currentDateSort);

  slider.addEventListener('input', () => {
    state.currentDateSort = uniqueDates[slider.value];
    dateLabel.textContent = formatDateSort(state.currentDateSort);
    applyVisibility();
  });

  document.getElementById('timelinePlayBtn').addEventListener('click', () => togglePlay(slider));

  applyVisibility();
}

function togglePlay(slider) {
  const btn = document.getElementById('timelinePlayBtn');
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
    btn.innerHTML = '&#9654;';
    return;
  }
  btn.innerHTML = '&#10074;&#10074;';
  playInterval = setInterval(() => {
    const next = Number(slider.value) + 1;
    if (next > Number(slider.max)) {
      clearInterval(playInterval);
      playInterval = null;
      btn.innerHTML = '&#9654;';
      return;
    }
    slider.value = next;
    slider.dispatchEvent(new Event('input'));
  }, 600);
}

function togglePanel() {
  const panel = document.getElementById('sidePanel');
  const btn = document.querySelector('.panel-toggle');
  panel.classList.toggle('hidden');
  btn.classList.toggle('panel-hidden');
  setTimeout(() => map.invalidateSize(), 350);
}

loadData();

</script>
</body>
